<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>العب مع المصري</title>
<link rel="stylesheet" href="styles.css?v=98">
</head>
<body>
<header>
  <h1 id="brand">العب مع المصري</h1>
</header>
<main>
  <section id="view-login" aria-labelledby="login-h">
    <h2 id="login-h" data-i18n="loginTitle"></h2>
    <p id="login-status" role="alert"></p>
    <form id="login-form">
      <label for="login-name" data-i18n="nameLabel"></label>
      <input id="login-name" name="name" autocomplete="username" maxlength="24" required>
      <label for="login-code" data-i18n="loginCodeLabel"></label>
      <input id="login-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      <button type="submit" data-i18n="loginButton"></button>
    </form>
  </section>

  <section id="view-lobby" aria-labelledby="lobby-h" hidden>
    <h2 id="lobby-h" data-i18n="lobbyTitle"></h2>
    <p id="lobby-screen-hint" data-i18n="lobbyScreenHint"></p>
    <div id="screen-lobby-games" class="lobby-screen">
      <h3 data-i18n="gamesMenuHeading"></h3>
      <div id="lobby-games-menu" class="menu-vertical" role="group" aria-label="games" tabindex="0"></div>
    </div>
    <div id="screen-lobby-tables" class="lobby-screen" hidden>
      <h3 data-i18n="tablesHeading"></h3>
      <form id="create-form">
        <label for="table-name-input" data-i18n="tableNameLabel"></label>
        <input id="table-name-input" maxlength="40">
        <button type="submit" data-i18n="createTable"></button>
      </form>
      <ul id="tables"></ul>
      <p id="no-tables" data-i18n="noTables"></p>
    </div>
    <div id="screen-lobby-friends" class="lobby-screen" hidden>
      <h3 data-i18n="friendsHeading"></h3>
      <form id="friend-form">
        <label for="friend-name" data-i18n="friendNameLabel"></label>
        <input id="friend-name" maxlength="24">
        <button type="submit" data-i18n="addFriend"></button>
      </form>
      <ul id="friends"></ul>
    </div>
    <div id="screen-lobby-report" class="lobby-screen" hidden>
      <h3 data-i18n="reportHeading"></h3>
      <form id="report-form">
        <label for="report-name" data-i18n="reportNameLabel"></label>
        <input id="report-name" maxlength="24">
        <label for="report-reason" data-i18n="reportReasonLabel"></label>
        <input id="report-reason" maxlength="300">
        <button type="submit" data-i18n="reportSend"></button>
      </form>
    </div>
    <div id="screen-lobby-block" class="lobby-screen" hidden>
      <h3 data-i18n="blockHeading"></h3>
      <form id="block-form">
        <label for="block-name" data-i18n="blockNameLabel"></label>
        <input id="block-name" maxlength="24">
        <button type="submit" data-i18n="blockButton"></button>
      </form>
    </div>
    <div id="screen-lobby-admin" class="lobby-screen" hidden>
      <h3 id="admin-h" data-i18n="adminHeading"></h3>
      <p data-i18n="adminHint"></p>
      <form id="admin-form">
        <label for="admin-name" data-i18n="adminNameLabel"></label>
        <input id="admin-name" maxlength="24">
        <label for="admin-action" data-i18n="adminActionLabel"></label>
        <select id="admin-action">
          <option value="mute1h" data-i18n="actMute1h"></option>
          <option value="kick" data-i18n="actKick"></option>
          <option value="tempban" data-i18n="actTempban"></option>
          <option value="unban" data-i18n="actUnban"></option>
        </select>
        <label for="admin-hours" data-i18n="adminHoursLabel"></label>
        <input id="admin-hours" type="number" min="1" max="8760" value="24">
        <label for="admin-reason" data-i18n="adminReasonLabel"></label>
        <input id="admin-reason" maxlength="200">
        <button type="submit" data-i18n="adminDo"></button>
      </form>
      <form id="owner-form" hidden>
        <label for="owner-action" data-i18n="adminActionLabel"></label>
        <select id="owner-action">
          <option value="permaban" data-i18n="actPermaban"></option>
          <option value="addmod" data-i18n="actAddmod"></option>
          <option value="removemod" data-i18n="actRemovemod"></option>
        </select>
        <label for="owner-name" data-i18n="adminNameLabel"></label>
        <input id="owner-name" maxlength="24">
        <button type="submit" data-i18n="adminDo"></button>
      </form>
      <form id="announce-form" hidden>
        <label for="announce-text" data-i18n="announceLabel"></label>
        <input id="announce-text" maxlength="500">
        <button type="submit" data-i18n="announceSend"></button>
      </form>
    </div>
  </section>

  <section id="view-world" aria-labelledby="adv-h" hidden>
    <h2 id="adv-h" data-i18n="advTitle"></h2>
    <div class="table-actions">
      <button id="adv-leave-button" data-i18n="advLeave"></button>
    </div>
    <p data-i18n="advInstructions"></p>
    <div id="adv-focus" tabindex="-1" role="application" aria-label="روح المغامرة"></div>
    <h3 data-i18n="chatHeading"></h3>
    <div id="adv-log" role="log" aria-live="polite"></div>
    <form id="pm-form">
      <label for="pm-input" data-i18n="advPmLabel"></label>
      <input id="pm-input" maxlength="500" autocomplete="off">
      <button type="submit" data-i18n="advPmSend"></button>
    </form>
  </section>

  <dialog id="table-menu-dialog" aria-labelledby="table-menu-h">
    <h3 id="table-menu-h"></h3>
    <div id="table-menu-buttons" class="menu-vertical" tabindex="0"></div>
  </dialog>
  <section id="view-table" aria-labelledby="table-h" hidden>
    <h2 id="table-h"></h2>
    <p id="screen-hint" data-i18n="screenHint"></p>
    <div id="screen-game" class="table-screen" role="application" aria-label="game screen">
      <section id="game-area" aria-labelledby="game-h">
        <h3 id="game-h" data-i18n="gameHeading"></h3>
        <div id="game-menu">
          <p data-i18n="startGamePrompt"></p>
          <div id="game-menu-buttons" class="menu-vertical" tabindex="0"></div>
        </div>
        <div id="game-view" tabindex="0" hidden></div>
      </section>
    </div>
    <div id="screen-log" class="table-screen" hidden>
      <h3 data-i18n="logHeading"></h3>
      <div id="room-log" role="log" aria-live="off" tabindex="-1"></div>
      <div id="game-log-holder"></div>
    </div>
    <div id="screen-chat" class="table-screen" hidden>
      <h3 data-i18n="chatHeading"></h3>
      <div id="chat-log" role="log" aria-live="polite" aria-label="chat"></div>
      <form id="chat-form">
        <label for="chat-input" data-i18n="chatLabel"></label>
        <input id="chat-input" maxlength="500" autocomplete="off">
        <button type="submit" tabindex="-1" data-i18n="sendButton"></button>
      </form>
    </div>
    <div id="screen-table" class="table-screen" hidden>
      <h3 data-i18n="playersHeading"></h3>
      <ul id="players"></ul>
      <div class="table-actions">
        <button id="leave-button" tabindex="-1" data-i18n="leaveTable"></button>
        <button id="mic-button" tabindex="-1" aria-pressed="false"></button>
        <button id="bot-button" tabindex="-1" data-i18n="addBot"></button>
        <button id="settings-button" tabindex="-1" data-i18n="settingsButton"></button>
      </div>
    </div>
  </section>
</main>

<dialog id="rules-dialog" aria-labelledby="rules-h">
  <h2 id="rules-h" data-i18n="rulesTitle"></h2>
  <div id="rules-body" tabindex="0"></div>
  <form method="dialog" id="rules-form">
    <button type="submit" data-i18n="rulesAccept"></button>
  </form>
</dialog>

<dialog id="invite-dialog" aria-labelledby="invite-h">
  <h2 id="invite-h" data-i18n="inviteTitle"></h2>
  <p id="invite-text"></p>
  <div class="menu-vertical" id="invite-buttons"></div>
</dialog>

<dialog id="howto-dialog" aria-labelledby="howto-h">
  <h2 id="howto-h"></h2>
  <div id="howto-body" tabindex="0"></div>
  <form method="dialog">
    <button type="submit" data-i18n="closeDlg"></button>
  </form>
</dialog>

<dialog id="settings-dialog" aria-labelledby="settings-h">
  <h2 id="settings-h" data-i18n="settingsTitle"></h2>
  <div id="settings-tabs" role="tablist" aria-labelledby="settings-h">
    <button type="button" role="tab" id="stab-general" data-i18n="stabGeneral" aria-selected="true"></button>
    <button type="button" role="tab" id="stab-access" data-i18n="stabAccess" aria-selected="false" tabindex="-1"></button>
    <button type="button" role="tab" id="stab-volume" data-i18n="stabVolume" aria-selected="false" tabindex="-1"></button>
    <button type="button" role="tab" id="stab-voice" data-i18n="stabVoice" aria-selected="false" tabindex="-1"></button>
    <button type="button" role="tab" id="stab-translate" data-i18n="stabTranslate" aria-selected="false" tabindex="-1"></button>
    <button type="button" role="tab" id="stab-privacy" data-i18n="stabPrivacy" aria-selected="false" tabindex="-1"></button>
    <button type="button" role="tab" id="stab-game" data-i18n="stabGame" aria-selected="false" tabindex="-1"></button>
  </div>
  <div id="spanel-general" role="tabpanel" aria-labelledby="stab-general">
    <fieldset>
      <legend data-i18n="languageLegend"></legend>
      <label><input type="radio" name="lang" value="ar"> <span data-i18n="langAr"></span></label>
      <label><input type="radio" name="lang" value="en"> <span data-i18n="langEn"></span></label>
    </fieldset>
    <fieldset>
      <legend data-i18n="loginCodeLegend"></legend>
      <button type="button" id="login-code-button" data-i18n="loginCodeButton"></button>
      <p id="login-code-text" role="status"></p>
    </fieldset>
  </div>
  <div id="spanel-access" role="tabpanel" aria-labelledby="stab-access" hidden>
    <label><input type="checkbox" id="notif-toggle"> <span data-i18n="notifLabel"></span></label>
  </div>
  <div id="spanel-volume" role="tabpanel" aria-labelledby="stab-volume" hidden>
    <fieldset>
      <legend data-i18n="musicLegend"></legend>
      <label><input type="radio" name="music" value="0"> <span data-i18n="musicOff"></span></label>
      <label><input type="radio" name="music" value="50"> 50%</label>
      <label><input type="radio" name="music" value="100"> 100%</label>
    </fieldset>
  </div>
  <div id="spanel-voice" role="tabpanel" aria-labelledby="stab-voice" hidden>
    <label><input type="checkbox" id="auto-mic"> <span data-i18n="autoMicLabel"></span></label>
  </div>
  <div id="spanel-translate" role="tabpanel" aria-labelledby="stab-translate" hidden>
    <p tabindex="0" data-i18n="translateSoon"></p>
  </div>
  <div id="spanel-privacy" role="tabpanel" aria-labelledby="stab-privacy" hidden>
    <button type="button" id="privacy-blocked" data-i18n="privacyBlockedBtn"></button>
  </div>
  <div id="spanel-game" role="tabpanel" aria-labelledby="stab-game" hidden>
    <p><label><input type="checkbox" id="opt-confirm-danger"> <span data-i18n="optConfirmDanger"></span></label></p>
    <p><label for="opt-bot-think" data-i18n="optBotThink"></label> <select id="opt-bot-think">
      <option value="500" data-i18n="bt500"></option>
      <option value="1000" data-i18n="bt1000"></option>
      <option value="2000" data-i18n="bt2000"></option>
      <option value="3000" data-i18n="bt3000"></option>
    </select></p>
    <p><label><input type="checkbox" id="opt-clear-kept"> <span data-i18n="optClearKept"></span></label></p>
    <p><label for="opt-keep-mode" data-i18n="optKeepMode"></label> <select id="opt-keep-mode">
      <option value="markers" data-i18n="keepModeMarkers"></option>
    </select></p>
  </div>
  <button type="button" id="settings-close" data-i18n="closeDlg" accesskey="غ"></button>
</dialog>

<dialog id="f1-menu-dialog" aria-labelledby="f1-menu-h">
  <h2 id="f1-menu-h" data-i18n="f1MenuTitle"></h2>
  <div class="menu-vertical" id="f1-menu-buttons"></div>
</dialog>

<dialog id="online-dialog" aria-labelledby="online-h">
  <h2 id="online-h"></h2>
  <div id="online-body" tabindex="0"></div>
  <button type="button" id="online-close" data-i18n="closeDlg"></button>
</dialog>

<dialog id="confirm-dialog" aria-labelledby="confirm-h">
  <h2 id="confirm-h"></h2>
  <div class="menu-vertical" id="confirm-buttons"></div>
</dialog>

<dialog id="help-dialog" aria-labelledby="help-h">
  <h2 id="help-h" data-i18n="helpTitle"></h2>
  <div id="help-body" tabindex="0"></div>
  <form method="dialog" id="help-form">
    <button type="submit" data-i18n="closeHelp"></button>
  </form>
</dialog>

<div id="live" class="sr-only" aria-live="polite"></div>
<script type="module">
  import * as LK from './livekit-client.esm.mjs';
  window.LivekitClient = LK;
  window.dispatchEvent(new Event('livekit-ready'));
</script>
<script src="farkle.js?v=98"></script>
<script src="i18n.js?v=98"></script>
<script src="games.js?v=98"></script>
<script src="land-sounds.js?v=98"></script>
<script src="adventure.js?v=98"></script>
<script src="app.js?v=98"></script>
</body>
</html>
